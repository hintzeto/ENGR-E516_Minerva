# Theme and server settings for Minerva.
# Streamlit reads this file automatically when you run `streamlit run app.py`
# from the minerva/ folder.

[theme]
base = "dark"
primaryColor = "#7C8CFF"             # lighter indigo, readable on dark backgrounds
backgroundColor = "#0E1117"          # main page background
secondaryBackgroundColor = "#1C1F2B" # sidebar, cards, and input boxes
textColor = "#E6E8F0"
font = "sans serif"

[server]
headless = true                      # don't try to open a browser (needed on a VM)
address = "0.0.0.0"                  # listen on all interfaces so others can connect
port = 8501
maxUploadSize = 50                   # MB

[browser]
gatherUsageStats = false
