services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: minerva
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: minerva
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minerva -d minerva"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://minerva:${POSTGRES_PASSWORD}@db:5432/minerva
      # plus whatever you already pass, e.g. BACKEND_MODE, OPENAI_API_KEY
    ports:
      - "8501:8501"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
