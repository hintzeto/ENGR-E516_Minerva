services:
  postgres:
    # PostgreSQL 16 with the pgvector extension preinstalled.
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg16}
    container_name: minerva-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-minerva}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-minerva}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs only the first time, while the data volume is still empty.
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      # Set POSTGRES_BIND_IP to this VM's Jetstream private IP.
      # Keep the Jetstream security group limited to authorized private callers.
      - "${POSTGRES_BIND_IP:-127.0.0.1}:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
